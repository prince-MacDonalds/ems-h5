<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EMS 青春邮路 H5</title>
    <style>
      :root {
        --postal: #007a3d;
        --postal-deep: #005f32;
        --ems-blue: #004b93;
        --drawer-width: 65%;
        --ink: #193227;
        --muted: #6d7b72;
        --paper: #f6f4ed;
        --soft: #e9eee5;
        --line: rgba(0, 122, 61, 0.13);
        --glass: rgba(255, 255, 255, 0.42);
        --shadow: 0 18px 55px rgba(21, 62, 43, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #dfe8dd;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
      }

      button {
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .app {
        position: relative;
        width: 100vw;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.85) 0, transparent 33%),
          linear-gradient(145deg, #f7f5ee 0%, #e3ece2 52%, #d4e0d1 100%);
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.12);
      }

      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: max(18px, env(safe-area-inset-top)) 22px max(20px, env(safe-area-inset-bottom));
        opacity: 0;
        pointer-events: none;
        transform: translateY(16px);
        transition: opacity 0.34s ease, transform 0.34s ease;
      }

      .screen.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .cover {
        justify-content: space-between;
        background: url("./background.png") center / cover no-repeat;
        isolation: isolate;
      }

      .cover::before {
        content: none;
        position: absolute;
        left: -22px;
        top: 13vh;
        z-index: -1;
        color: rgba(0, 122, 61, 0.045);
        font-size: clamp(118px, 38vw, 178px);
        font-weight: 900;
        letter-spacing: 0;
        transform: rotate(-10deg);
      }

      .cover::after {
        content: none;
        position: absolute;
        right: -90px;
        bottom: 8vh;
        z-index: -1;
        width: 300px;
        height: 300px;
        border: 32px solid rgba(0, 122, 61, 0.045);
        border-radius: 44% 56% 52% 48%;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.58);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 12px 28px rgba(8, 72, 42, 0.1);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: transform 0.18s ease, background 0.18s ease;
      }

      .icon-button:active {
        transform: scale(0.94);
        background: rgba(255, 255, 255, 0.6);
      }

      .menu-lines,
      .back-lines {
        position: relative;
        width: 20px;
        height: 14px;
      }

      .menu-lines::before,
      .menu-lines::after,
      .menu-lines span {
        content: "";
        position: absolute;
        left: 0;
        width: 20px;
        height: 2px;
        border-radius: 99px;
        background: var(--ems-blue);
      }

      .menu-lines::before {
        top: 0;
      }

      .menu-lines span {
        top: 6px;
        width: 14px;
      }

      .menu-lines::after {
        bottom: 0;
        width: 17px;
      }

      .back-lines::before,
      .back-lines::after {
        content: "";
        position: absolute;
        left: 4px;
        width: 14px;
        height: 2px;
        border-radius: 99px;
        background: var(--ems-blue);
        transform-origin: 1px 50%;
      }

      .back-lines::before {
        top: 2px;
        transform: rotate(135deg);
      }

      .back-lines::after {
        bottom: 2px;
        transform: rotate(-135deg);
      }

      .cover-copy {
        display: none;
        margin-bottom: 17vh;
      }

      .cover-slogan {
        max-width: 245px;
        margin: 0;
        color: var(--postal-deep);
        font-size: clamp(32px, 10vw, 46px);
        font-weight: 700;
        line-height: 1.14;
        letter-spacing: 0;
      }

      .cover-bottom {
        display: none;
        justify-content: space-between;
        gap: 18px;
        color: rgba(25, 50, 39, 0.62);
        font-size: 13px;
        letter-spacing: 0;
      }

      .menu-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        width: 100%;
        padding-right: 14px;
        padding-left: 14px;
        padding-top: max(18px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        pointer-events: none;
        background: transparent;
        box-shadow: none;
        overflow: hidden;
      }

      .menu-screen::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--drawer-width);
        max-width: 318px;
        border-right: 1px solid rgba(255, 255, 255, 0.64);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.2)),
          rgba(248, 241, 224, 0.3);
        box-shadow: 22px 0 56px rgba(27, 45, 64, 0.13), inset -1px 0 0 rgba(255, 255, 255, 0.32);
        backdrop-filter: blur(22px) saturate(124%);
        -webkit-backdrop-filter: blur(22px) saturate(124%);
        transform: translateX(-106%);
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .menu-screen.open {
        pointer-events: auto;
      }

      .menu-screen.open::before,
      .menu-screen.open .topbar,
      .menu-screen.open .menu-title,
      .menu-screen.open .menu-grid {
        transform: translateX(0);
      }

      .menu-screen .topbar {
        position: relative;
        z-index: 1;
        width: var(--drawer-width);
        max-width: 318px;
        align-items: center;
        gap: 10px;
        justify-content: flex-start;
        transform: translateX(-106%);
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .menu-screen .back-lines::before {
        left: 3px;
        top: 6px;
        width: 16px;
        transform: rotate(45deg);
      }

      .menu-screen .back-lines::after {
        left: 3px;
        bottom: 6px;
        width: 16px;
        transform: rotate(-45deg);
      }

      .menu-title {
        position: relative;
        z-index: 1;
        width: var(--drawer-width);
        max-width: 318px;
        margin: 8px 0 14px;
        color: #2f9278;
        font-size: 21px;
        font-weight: 760;
        line-height: 1;
        text-align: center;
        letter-spacing: 5px;
        white-space: nowrap;
        transform: translateX(-106%);
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .menu-title::before,
      .menu-title::after {
        content: "...";
        position: absolute;
        top: -2px;
        color: rgba(47, 146, 120, 0.36);
        font-size: 21px;
        letter-spacing: 4px;
      }

      .menu-title::before {
        left: 10px;
      }

      .menu-title::after {
        right: 10px;
      }

      .menu-title-mark {
        position: absolute;
        left: 50%;
        bottom: -14px;
        width: 42px;
        height: 2px;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #e98b2a 0 46%, transparent 46% 56%, #4a8ab7 56% 100%);
      }

      .menu-grid {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: var(--drawer-width);
        max-width: 318px;
        gap: 10px;
        padding: 22px 0 18px;
        counter-reset: menu;
        transform: translateX(-106%);
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .menu-item {
        position: relative;
        display: block;
        width: 100%;
        min-height: 0;
        padding: 0;
        background: transparent;
        overflow: visible;
        counter-increment: menu;
      }

      .menu-item:nth-child(2),
      .menu-item:nth-child(5) {
        transform: none;
      }

      .menu-item:nth-child(3) {
        transform: none;
      }

      .menu-item::after {
        content: none;
      }

      .menu-button-img {
        display: block;
        width: 100%;
        height: auto;
      }

      .menu-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .detail {
        background: url("./功能页背景.png") center / cover no-repeat;
      }

      .detail-header {
        min-height: 20dvh;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        position: relative;
        z-index: 1;
        margin-top: 5px;
        padding: 20px 20px 18px;
        border: 1px solid rgba(255, 255, 255, 0.68);
        border-radius: 26px;
        background:
          linear-gradient(140deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.26)),
          rgba(255, 255, 255, 0.36);
        box-shadow: 0 18px 42px rgba(28, 62, 45, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(20px) saturate(122%);
        -webkit-backdrop-filter: blur(20px) saturate(122%);
      }

      .detail-header-row {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
      }

      .detail-nav {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        min-height: 44px;
      }

      .detail-nav .icon-button {
        width: 44px;
        height: 44px;
      }

      .detail-nav .back-lines {
        width: 20px;
        height: 20px;
      }

      .detail-nav .back-lines::before,
      .detail-nav .back-lines::after {
        left: 50%;
        top: 50%;
        bottom: auto;
        width: 20px;
        transform-origin: 50% 50%;
      }

      .detail-nav .back-lines::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .detail-nav .back-lines::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .postal-logo {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        border-radius: 15px;
        background: var(--postal);
        color: white;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        box-shadow: 0 12px 28px rgba(0, 122, 61, 0.18);
      }

      .detail-title {
        margin: 0;
        color: #183629;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 760;
        letter-spacing: 0;
      }

      .detail-desc {
        margin: 0;
        color: #35574a;
        font-size: 14px;
        font-weight: 680;
        line-height: 1.45;
      }

      .detail-extra {
        max-width: 275px;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .detail-body {
        position: relative;
        flex: 1;
        min-height: 0;
        padding-top: 5px;
      }

      .ledger-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 116px;
        gap: 4px;
        align-items: stretch;
        height: 100%;
      }

      .badge-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
        padding-top: 0;
        padding-right: 4px;
      }

      .badge {
        position: relative;
        display: grid;
        place-items: center;
        width: min(52vw, 210px);
        aspect-ratio: 1;
        border-radius: 36px;
        background: transparent;
        box-shadow: 0 18px 42px rgba(31, 77, 55, 0.1);
        overflow: hidden;
        transition: transform 0.24s ease, opacity 0.24s ease;
      }

      .badge-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .badge svg {
        width: 58%;
        height: 58%;
        stroke: rgba(24, 54, 41, 0.82);
        stroke-width: 2.25;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .badge-name {
        margin: 8px 0 8px;
        color: #173528;
        font-size: 22px;
        font-weight: 760;
        line-height: 1.16;
        text-align: center;
      }

      .badge-date {
        margin: 16px 0 0;
        color: var(--postal-deep);
        font-size: 13px;
        font-weight: 760;
        letter-spacing: 1px;
      }

      .badge-note {
        max-width: 230px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
        text-align: center;
      }

      .timeline-wrap {
        position: relative;
        align-self: stretch;
        height: auto;
        max-height: none;
        overflow: visible;
      }

      .timeline-wrap::before {
        content: "";
        position: absolute;
        top: 8px;
        bottom: 28px;
        left: 22px;
        width: 1px;
        background: rgba(0, 122, 61, 0.18);
      }

      .timeline {
        height: 100%;
        overflow-y: auto;
        padding: 0 0 120px;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
      }

      .timeline::-webkit-scrollbar {
        display: none;
      }

      .timeline-spacer {
        height: 0;
      }

      .time-node {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        height: 58px;
        padding-left: 44px;
        padding-right: 4px;
        color: rgba(25, 50, 39, 0.48);
        font-size: 12px;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.18;
        text-align: left;
        background: transparent;
        scroll-snap-align: center;
        transition: color 0.2s ease, transform 0.2s ease;
      }

      .time-node::after {
        content: "";
        position: absolute;
        left: 16px;
        width: 13px;
        height: 13px;
        border-radius: 999px;
        background: #d7e0d5;
        border: 3px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 0 0 1px rgba(0, 122, 61, 0.08);
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .time-node.active {
        color: var(--postal-deep);
        font-weight: 750;
        transform: translateX(-3px);
        text-shadow: 0 0 12px rgba(0, 122, 61, 0.22);
      }

      .time-node.active::after {
        background: radial-gradient(circle, #ffffff 0 23%, #1ba66a 25% 58%, var(--postal) 60%);
        transform: scale(1.38);
        box-shadow:
          0 0 0 6px rgba(0, 122, 61, 0.12),
          0 0 18px rgba(0, 122, 61, 0.48),
          0 0 34px rgba(0, 122, 61, 0.22);
      }

      .concept-layout {
        display: flex;
        flex-direction: column;
        gap: 18px;
        height: 100%;
      }

      .visual-panel {
        position: relative;
        min-height: 180px;
        border-radius: 32px;
        background:
          linear-gradient(140deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.28)),
          rgba(255, 255, 255, 0.32);
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .visual-panel svg {
        position: absolute;
        inset: 20px;
        width: calc(100% - 40px);
        height: calc(100% - 40px);
        stroke: var(--postal);
        stroke-width: 1.9;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .pill-row,
      .choice-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .pill,
      .choice {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.52);
        color: #355245;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
        transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .pill {
        padding: 10px 14px;
        font-size: 13px;
      }

      .choice {
        padding: 11px 13px;
        font-size: 13px;
      }

      .pill.active,
      .choice.active {
        background: var(--postal);
        color: white;
      }

      .interaction-card {
        border-radius: 28px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.48);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74);
      }

      .interaction-card h3 {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.2;
      }

      .reminder-layout {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 12px;
        height: 100%;
        min-height: 0;
      }

      .reminder-stage {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 0;
      }

      .reminder-card {
        position: relative;
        width: min(100%, 360px);
        max-height: 100%;
        display: grid;
        place-items: center;
      }

      .reminder-img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 18px 34px rgba(25, 50, 39, 0.12));
      }

      .reminder-hotspot {
        position: absolute;
        left: 7%;
        top: 60%;
        width: 42%;
        height: 12%;
        border-radius: 18px;
        background: transparent;
      }

      .reminder-switch {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 42px;
      }

      .reminder-arrow {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.58);
        color: var(--ems-blue);
        font-size: 20px;
        font-weight: 760;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 8px 20px rgba(8, 72, 42, 0.08);
      }

      .reminder-dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .reminder-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(0, 75, 147, 0.22);
        transition: width 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }

      .reminder-dot.active {
        width: 22px;
        background: var(--ems-blue);
        box-shadow: 0 0 12px rgba(0, 75, 147, 0.28);
      }

      .reminder-sheet-backdrop {
        position: absolute;
        inset: 0;
        z-index: 18;
        background: rgba(20, 35, 30, 0.1);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease;
      }

      .reminder-sheet-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .reminder-sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 19;
        padding: 18px 18px max(18px, env(safe-area-inset-bottom));
        border: 1px solid rgba(255, 255, 255, 0.68);
        border-radius: 28px 28px 0 0;
        background:
          linear-gradient(140deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.42)),
          rgba(255, 255, 255, 0.52);
        box-shadow: 0 -18px 44px rgba(31, 77, 55, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(22px) saturate(128%);
        -webkit-backdrop-filter: blur(22px) saturate(128%);
        transform: translateY(108%);
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .reminder-sheet.open {
        transform: translateY(0);
      }

      .sheet-handle {
        width: 46px;
        height: 5px;
        margin: 0 auto 14px;
        border-radius: 999px;
        background: rgba(30, 45, 45, 0.18);
      }

      .sheet-time {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(60, 80, 80, 0.12);
        color: #4a5552;
        font-size: 15px;
        font-weight: 680;
      }

      .sheet-list {
        display: grid;
        gap: 13px;
        margin: 16px 0;
      }

      .sheet-item,
      .sheet-note {
        display: grid;
        grid-template-columns: 28px 1fr;
        align-items: center;
        gap: 12px;
        color: #333f3b;
        font-size: 14px;
        line-height: 1.35;
      }

      .sheet-check {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(98, 106, 104, 0.72);
        color: white;
        font-size: 16px;
        font-weight: 760;
      }

      .sheet-note {
        padding-top: 14px;
        border-top: 1px solid rgba(60, 80, 80, 0.12);
        color: #5f6966;
      }

      .sheet-icon {
        color: #828b88;
        font-size: 22px;
      }

      .sheet-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .sheet-action {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        border: 1px solid rgba(80, 90, 90, 0.1);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.48);
        color: #5f6664;
        font-weight: 680;
      }

      .interaction-card p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      function renderLedger() {

                ${displayNodes
                  .map(({ item, index }) => `
                    <button class="time-node ${index === selectedLedger ? "active" : ""}" data-index="${index}">
                      ${item[1]}
                    </button>
                  `)
                  .join("")}
                <div class="timeline-spacer"></div>
              </div>
            </aside>
          </div>
        `;

        const timeline = document.getElementById("timeline");
        timeline.querySelectorAll(".time-node").forEach((button) => {
          button.addEventListener("click", () => selectLedger(Number(button.dataset.index), true));
        });
        requestAnimationFrame(() => {
          const active = timeline.querySelector(".time-node.active");
          if (active) timeline.scrollTop = active.offsetTop;
        });
        timeline.addEventListener("scroll", () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const nodes = [...timeline.querySelectorAll(".time-node")];
            const center = timeline.getBoundingClientRect().top + timeline.clientHeight / 2;
            const nearest = nodes.reduce((best, current) => {
              const rect = current.getBoundingClientRect();
              const dist = Math.abs(rect.top + rect.height / 2 - center);
              return dist < best.dist ? { el: current, dist } : best;
            }, { el: nodes[0], dist: Infinity });
            const nextIndex = Number(nearest.el.dataset.index);
            if (nextIndex !== selectedLedger) selectLedger(nextIndex, false);
          }, 80);
        });
      }

          const active = Number(button.dataset.index) === selectedLedger;

          nodeImg.src = slide.node;

          }
        });
        detailBody.querySelector("[data-reminder-prev]").addEventListener("click", () => setSlide(active - 1));
        detailBody.querySelector("[data-reminder-next]").addEventListener("click", () => setSlide(active + 1));

        }, { passive: true });

        setSlide(active);
      }

                  <circle cx="12" cy="12" r="8"></circle>
                  <path d="M4 12h16"></path>
                  <path d="M12 4c2.2 2.2 3.2 4.8 3.2 8s-1 5.8-3.2 8"></path>
                  <path d="M12 4c-2.2 2.2-3.2 4.8-3.2 8s1 5.8 3.2 8"></path>
                </svg>
              </span>
              <span>
                <strong>已匹配邮政寄递网络</strong>
                <span>可覆盖校园、城市、省际及更远目的地</span>
              </span>
            </div>
            <div class="reserve-feedback" id="networkFeedback"></div>
            <button class="reserve-action network" id="networkSubmit">查看网络承接能力</button>
          </div>
        `;

        const rangeButtons = [...detailBody.querySelectorAll("[data-network-range]")];
        const sceneButtons = [...detailBody.querySelectorAll("[data-network-scene]")];
        const feedback = detailBody.querySelector("#networkFeedback");
        const submit = detailBody.querySelector("#networkSubmit");

        function updateNetwork() {
          rangeButtons.forEach((button) => button.classList.toggle("active", button.dataset.networkRange === selectedRange));
          sceneButtons.forEach((button) => button.classList.toggle("active", selectedScenes.has(button.dataset.networkScene)));
          const scenes = [...selectedScenes];
          feedback.innerHTML = `<strong>当前选择：</strong>${selectedRange} / ${scenes.length ? scenes.join("、") : "未选择目的场景"}`;
        }

        rangeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            selectedRange = button.dataset.networkRange;
            updateNetwork();
          });
        });

        sceneButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const value = button.dataset.networkScene;
            if (selectedScenes.has(value)) {
              selectedScenes.delete(value);
            } else {
              selectedScenes.add(value);
            }
            updateNetwork();
          });
        });

        submit.addEventListener("click", () => {
          showToast("当前为功能展示原型，邮政网络功能开发中，敬请期待。");
        });

        updateNetwork();
      }

      function renderConcept(key) {
        const data = conceptData[key];
        let active = 0;
        detailBody.innerHTML = `
          <div class="concept-layout">
            <section class="visual-panel">${svg(data.icon)}</section>
            <div class="choice-grid">
              ${data.tabs
                .map(([label], index) => `<button class="choice ${index === 0 ? "active" : ""}" data-index="${index}">${label}</button>`)
                .join("")}
            </div>
            <section class="interaction-card">
              <h3>${data.tabs[0][0]}</h3>
              <p>${data.tabs[0][1]}</p>
              ${data.action ? '<button class="primary-action" id="reserveAction">预约重要件寄递</button>' : ""}
            </section>
          </div>
        `;

        const card = detailBody.querySelector(".interaction-card");
        detailBody.querySelectorAll(".choice").forEach((button) => {
          button.addEventListener("click", () => {
            active = Number(button.dataset.index);
            detailBody.querySelectorAll(".choice").forEach((item) => item.classList.toggle("active", item === button));
            card.querySelector("h3").textContent = data.tabs[active][0];
            card.querySelector("p").textContent = data.tabs[active][1];
          });
        });

        detailBody.querySelector("#reserveAction")?.addEventListener("click", () => {
          showToast("功能开发中，敬请期待", 1800);
        });
      }

      document.addEventListener("click", (event) => {
        if (event.target.closest("[data-menu-open]")) openMenu();
        if (event.target.closest("[data-menu-close]") || event.target === menuDrawer) closeMenu();
        if (event.target.closest("[data-back-menu]")) backToMenu();
        const go = event.target.closest("[data-go]");
        if (go) showScreen(go.dataset.go);
        const page = event.target.closest("[data-page]");
        if (page) openPage(page.dataset.page);
      });

      renderMenu();
    </script>
  </body>
</html>
